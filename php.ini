; Arquivo php.ini (modo produção)

; Ativa o relatório de erros apenas para erros graves (ideal para produção)
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Log de erros
log_errors = On
error_log = /var/log/php_errors.log

; Limites de execução
max_execution_time = 60
memory_limit = 512M
post_max_size = 100M
upload_max_filesize = 100M

; Configurações de timezone
date.timezone = America/Sao_Paulo

; Sessões
session.gc_maxlifetime = 1440
session.cookie_httponly = 1
session.use_strict_mode = 1

; Extensões necessárias para phpspreadsheet
extension=gd
extension=zip
extension=mbstring
extension=xml
extension=bcmath

; Opções de segurança
expose_php = Off
allow_url_fopen = Off

; Arquivo para carregar variáveis de ambiente (.env)
variables_order = "EGPCS"
